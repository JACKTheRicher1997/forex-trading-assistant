name: EMA Cross Check (LINE Alert)

on:
  schedule:
    # ตรวจสอบสัญญาณ EMA Cross ทุก 5 นาที (GitHub Actions cron ต่ำสุด 5 นาที)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-ema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: ema-cross-check
    permissions:
      contents: write
    env:
      # แหล่งข้อมูลราคา: twelvedata = XAU/USD Spot (ตรงกับ MT5/Exness)
      PRICE_SOURCE: "twelvedata"
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      # ใช้เวลาไทย (UTC+7) ทั้งงาน GH Actions ตรวจ EMA Cross และ align แท่ง M5 ปิด
      # ให้ตรงกับเวลาเครื่องที่รัน bot ต่าง ๆ ในระบบ
      TZ: "Asia/Bangkok"
      SYMBOL: "XAUUSDm"
      TIMEFRAME: "M5"
      EMA_FAST: "50"
      EMA_SLOW: "150"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EMA cross check
        run: python main.py --check-ema-now

      # บันทึกสถานะ "สัญญาณที่แจ้งเตือนแล้ว" กลับขึ้น GitHub repo
      # เพราะตัวรัน (runner) เป็นแบบ ephemeral หน่วยความจำหายทุกครั้ง
      # ถ้าไม่ commit กลับ ระบบจะส่งสัญญาณซ้ำทุกๆ 5 นาที
      - name: Persist EMA cross state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update EMA cross state (bot)"
            git push
          else
            echo "ไม่มีสถานะใหม่ — ไม่ต้อง commit"
          fi